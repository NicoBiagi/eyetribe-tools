[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "eyetribe-tools"
version = "0.1.1"
description = "Python tools for running Eye Tribe calibration, validation, and gaze overlays."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Nico Biagi" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
]

[project.scripts]
eyetribe-session = "eyetribe_tools.session:run_eyetribe_session_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["eyetribe_tools*"]

[tool.setuptools.package-data]
eyetribe_tools = [
  "vendor/EyeTribe/Server/*",
  "vendor/EyeTribe/Server/**/*"
]